[package]
name = "searxh"
version = "0.2.0"
edition = "2024"
description = "Fast desktop file indexer, fuzzy/frecency/favor search CLI, virtual folder filter, and inspector built on jwalk and nucleo"
license = "MIT"
repository = "https://github.com/towjacix/searxh"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
imagesize = "0.13"
jwalk = "0.8"
kamadak-exif = "0.5"
notify = "7"
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
